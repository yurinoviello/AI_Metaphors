# AI Metaphors Configuration File

# Term and definition settings
term_name: null  # The name of the term to generate a metaphor for
term_value: null  # The definition of the term
metaphor: null  # A custom metaphor to use (if not generating one)
term_type: "definition"  # Type of term: "code", "definition" or "academic-definition"

# Dataset example settings
use_dataset_example: -1  # Index of example to use from the dataset (0-13), -1 to disable

# Generation options
generate_metaphor_text: false  # Whether to automatically generate a metaphor
animation_type: "basic"  # Type of animation: "basic", "voice", "avatar" or "cartoon-avatar"

# Directory settings
bin_directory: "/usr/local/bin"  # Directory containing executable binaries
working_dir: "./animations"  # Directory where animations will be saved

# Model settings
model: "openai-gpt-4o"  # LLM to be used for general processing
model_classes: "default"  # LLM to be used specifically for processing classes
model_manim: "anthropic-claude-3.7-sonnet"  # LLM to be used specifically for Manim script generation
temperature: 0.1  # Creativity level for LLM responses (0.0-1.0)

# Execution settings
vllm_fix: false  # Whether to perform automatic vLLM analysis and code correction
auto_play: false  # Whether to automatically play the animation after generation
high_quality: false  # Whether to generate high-quality animation (1080p60)
debug: false  # Whether to enable debug mode with additional logging
