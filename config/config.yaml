# AI Metaphors Configuration File
# This file contains default values for command-line arguments
# Command-line arguments will override these values

# Term and definition
term_name: null  # Uncomment and set to provide a default term name
term_definition: null  # Uncomment and set to provide a default term definition
metaphor: null  # Uncomment and set to provide a default metaphor

# Dataset example (0-13), null to ignore
use_dataset_example: -1

# Generation options
generate_metaphor_text: true
animation_type: "basic"

# Directory settings
bin_directory: "/usr/local/bin"
working_dir: "./animations"

# Model settings
model: "openai-gpt-4o"  # LLM to be used for processing
model_manim: "default"  # LLM to be used to process only the manim script
temperature: 0.1

# Execution settings
vllm_fix: false  # Perform automatic vllm analysis and code correction
auto_play: false  # Automatically play the animation at the end of execution
high_quality: false  # Generate high quality animation (1080p60p)
debug: false  # Activate debug mode