name: Python build

on: [push]

env:
  JETBRAINS_MONO_VERSION: 2.304
  PYTHON_VERSION: "3.10"

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

