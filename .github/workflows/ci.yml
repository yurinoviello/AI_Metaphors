  code-style:
    needs: setup

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Check the code
        run: |
          ruff check --output-format=github

      - name: Format the code
        run: |
          ruff format --check
