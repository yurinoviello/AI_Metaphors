[tool.poetry]
name = "ai-metaphors"
version = "0.1.0"
description = "This Python module generates metaphors, associated classes, descriptions, and Manim animation code for a given term. It integrates several providers, including GrazieProvider and ManimProvider, to produce results and animations."
authors = ["yurinovinello <novielloyuri@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
manim = { git = "https://github.com/yurinoviello/manim.git" }
manimpango= "0.6.0"
datasets = "^3.2.0"
grazie-api-gateway-client = "0.1.13"
pylint = "^3.3.2"
python-dotenv = ">=0.21.0,<0.22.0"
openai = ">=1.68.2"
scikit-image = ">=0.19.3"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "space-grazie-ml"
url = "https://packages.jetbrains.team/pypi/p/grazi/grazie-ml/simple"
priority = "supplemental"

[tool.poetry.scripts]
ai-metaphors = "ai_metaphors.main:main"

# ---------------------------Ruff configuration---------------------------
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # pydocstyle
    "D",
    # flake8-pytest-style
    "PT",
    # flake8-print
    "T20",
    # Missing type annotation for self/cls in method
    "ANN10",
    # Checks that function arguments are annotated with a more specific type than Any
    "ANN401",
    # Checks for missing from __future__ import annotations imports upon detecting type annotations that can be written more succinctly under PEP 563
    "FA100",
    # Checks for packages that are missing an __init__.py file
    "INP001",
    # Checks for the use of string literals in exception constructors
    "EM101",
    # Checks for long exception messages that are not defined in the exception class itself
    "TRY003",

    # Ignore "too many arguments in function definition"
    "PLR0913",
    # Ignore "Boolean-typed positional argument"
    "FBT001",
    # Ignore "`subprocess` call: check for execution of untrusted input"
    "S603",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = true

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true