services:
  ai-metaphors-cli:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./animations:/app/animations
      - ./config:/app/config
    entrypoint: [
      "python", "-m", "ai_metaphors.cli.main", "--bin-directory", "/usr/local/bin", "--config", "config/config.yaml"
    ]
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy

  ai-metaphors-cadence:
    build:
      context: .
      dockerfile: cadence.Dockerfile
    volumes:
      - .:/app
      - ./animations:/app/animations
      - ./config:/app/config
    entrypoint: [
      "python", "-m", "ai_metaphors.cli.main", "--bin-directory", "/opt/conda/bin", "--config", "config/config.yaml"
    ]
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    profiles: ["gpu"]
    depends_on:
      db:
        condition: service_healthy

  ai-metaphors-server:
    build:
      context: .
      dockerfile: server.Dockerfile
    ports:
      - "8898:8898"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "PGPASSWORD=postgres pg_isready -U postgres -d postgres" ]
      interval: 10s
      timeout: 10s
      retries: 5